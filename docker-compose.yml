services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: friction
      POSTGRES_PASSWORD: friction_pass
      POSTGRES_DB: friction
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U friction -d friction"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://friction:friction_pass@db:5432/friction
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  pgdata:
